<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>剧本评估 Agent</title>
<!-- 视觉风格 B：左侧导航 + 纯白扁平；首页只有「标题 + 一个输入框 + 一行示例」 -->
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/eval.css">
<link rel="stylesheet" href="../neo/neo.css">
<link rel="stylesheet" href="flat.css">
</head>
<body data-page="home" data-nav="entry">
<aside class="sbar" id="sbar">
  <div class="sb-top">
    <span class="sb-logo">评</span>
    <b class="sb-name">剧本评估 Agent</b>
    <button class="sb-fold" id="sbFold" type="button" title="收起侧栏">◀</button>
  </div>
  <nav class="sb-nav">
    <a class="sb-item" data-nav="entry" href="index.html"><i>🏠</i><span>首页</span></a>
    <a class="sb-item" data-nav="diagnose" href="diagnose.html?stage=result"><i>🔍</i><span>剧本诊断优化</span></a>
    <button class="sb-item" type="button" data-soon="能力广场为后续规划，Demo 中未开放"><i>🧩</i><span>能力广场</span><em class="sb-new">NEW</em></button>
  </nav>
  <div class="sb-grp">最近评估</div>
  <div class="sb-recent">
    <a class="sb-rec" href="diagnose.html?stage=result">《退婚当日，我闪婚了首富》</a>
    <a class="sb-rec" href="diagnose.html?stage=result">《总裁的隐婚娇妻》</a>
    <a class="sb-rec" href="diagnose.html?stage=result">《长夜将明》前 8 集</a>
    <a class="sb-rec" href="diagnose.html?stage=result">《春风不度》第 1 集</a>
  </div>
  <div class="sb-foot">Demo 数据 · 模拟评估结果</div>
</aside>

<header id="topbar"></header>

<main class="entry">
  <div class="entry-hero">
    <h1>今天想评估哪部剧本？</h1>
    <div class="hero-sub">把剧本发给我，我逐场读完，给出评级、问题定位与可执行的修改建议</div>
  </div>

  <div class="card composer-card composer-uni" id="uniBox">
    <div class="uni-top">
      <textarea id="reqInput" rows="3"
        placeholder="说清这次的评估要求，例如：付费真人短剧，主投红果，重点看剧情逻辑与伏笔回收，再筛一遍合规风险"></textarea>
    </div>
    <input type="file" id="filePicker" hidden
           accept=".pdf,.doc,.docx,.txt,application/pdf,application/msword,text/plain">
    <div class="file-list" id="fileList"></div>
    <div class="composer-foot">
      <button type="button" class="attach-btn" id="dropzone" title="添加剧本文件（也可直接拖进输入框）">
        <span class="dz-icon">📎</span>
        <span class="dz-main">添加剧本</span>
      </button>
      <span class="hint-inline" id="fileStat"></span>
      <span class="spacer"></span>
      <button class="btn btn-primary send-btn" id="startBtn" type="button"
              title="发起评估" aria-label="发起评估">↑</button>
    </div>
  </div>

  <div class="skill-row">
    <span class="sr-hint">没有现成文件？点一个示例体量直接开始</span>
    <div class="samp-row" id="sampRow">
      <button class="samp" type="button" data-samp="seg"><i>📄</i><span>评一小段剧本</span></button>
      <button class="samp" type="button" data-samp="one"><i>🎬</i><span>评单集剧本</span></button>
      <button class="samp" type="button" data-samp="few"><i>📑</i><span>评 8 集连续剧本</span></button>
      <button class="samp" type="button" data-samp="full"><i>📚</i><span>评 24 集全本</span></button>
    </div>
  </div>
</main>

<script src="../js/mock.js"></script>
<script src="../js/ui.js"></script>
<script src="../neo/neo.js"></script>
<script src="home.js"></script>
<script src="flat.js"></script>
</body>
</html>
