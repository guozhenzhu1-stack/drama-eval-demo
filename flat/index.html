<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>剧本创作Agent</title>
<!-- 视觉风格 B：首页 1:1 复刻参考稿，仅把输入框下方那一行换成「示例剧本」 -->
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/eval.css">
<link rel="stylesheet" href="../neo/neo.css">
<link rel="stylesheet" href="flat.css">
</head>
<body data-page="home" data-nav="entry">
<aside class="sbar" id="sbar">
  <div class="sb-top">
    <span class="sb-logo plain">🪄</span>
    <b class="sb-name">剧本创作Agent</b>
    <button class="sb-fold" id="sbFold" type="button" title="收起侧栏">◀</button>
  </div>
  <nav class="sb-nav">
    <a class="sb-item" data-nav="entry" href="index.html"><i>🏠</i><span>首页</span></a>
    <button class="sb-item" type="button" data-soon="项目管理为后续规划，Demo 中未开放"><i>📄</i><span>项目</span></button>
    <button class="sb-item" type="button" data-soon="Skill 广场为后续规划，Demo 中未开放"><i>🧩</i><span>Skill 广场</span><em class="sb-new">NEW</em></button>
  </nav>
  <div class="sb-grp">最近项目</div>
  <div class="sb-recent">
    <button class="sb-rec" type="button" data-soon="Demo 只打通了剧本评估，这个项目未展开">新项目</button>
    <button class="sb-rec" type="button" data-soon="Demo 只打通了剧本评估，这个项目未展开">新项目</button>
    <button class="sb-rec" type="button" data-soon="Demo 只打通了剧本评估，这个项目未展开">《心动信号》台词润色…</button>
    <button class="sb-rec" type="button" data-soon="Demo 只打通了剧本评估，这个项目未展开">《长夜未明》短篇改编…</button>
    <button class="sb-rec" type="button" data-soon="Demo 只打通了剧本评估，这个项目未展开">《致命前妻》北美出海…</button>
  </div>
</aside>

<header id="topbar"></header>

<main class="entry">
  <div class="entry-hero">
    <h1>开始一次短剧创作</h1>
    <div class="hero-sub">上传灵感素材、描述想法，或者挑一个技能直接开工</div>
  </div>

  <div class="card composer-card composer-uni" id="uniBox">
    <div class="uni-top">
      <textarea id="reqInput" rows="6"
        placeholder="描述你的创作需求，比如：想写一个女频逃婚短剧..."></textarea>
    </div>
    <input type="file" id="filePicker" hidden
           accept=".pdf,.doc,.docx,.txt,application/pdf,application/msword,text/plain">
    <div class="file-row">
      <div class="file-list" id="fileList"></div>
      <span class="hint-inline" id="fileStat"></span>
    </div>
    <div class="composer-foot">
      <span class="spacer"></span>
      <button type="button" class="attach-btn" id="dropzone" title="添加剧本文件（也可直接拖进输入框）"
              aria-label="添加剧本文件">📎</button>
      <button class="btn btn-primary send-btn" id="startBtn" type="button"
              title="发起评估" aria-label="发起评估">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.6 11.2 20 4 12.8 20.4l-1.6-6.4-7.6-2.8Z"/></svg>
      </button>
    </div>
  </div>

  <div class="skill-row">
    <span class="sr-hint">示例剧本</span>
    <div class="samp-row" id="sampRow">
      <button class="samp" type="button" data-samp="seg"><i>📄</i><span>一小段剧本</span></button>
      <button class="samp" type="button" data-samp="one"><i>🎬</i><span>单集剧本</span></button>
      <button class="samp" type="button" data-samp="few"><i>📑</i><span>8 集连续剧本</span></button>
      <button class="samp" type="button" data-samp="full"><i>📚</i><span>24 集全本</span></button>
    </div>
  </div>
</main>

<script src="../js/mock.js"></script>
<script src="../js/ui.js"></script>
<script src="../neo/neo.js"></script>
<script src="home.js"></script>
<script src="flat.js"></script>
</body>
</html>
