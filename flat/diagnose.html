<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>剧本诊断优化 · 剧本创作Agent</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/eval.css">
<link rel="stylesheet" href="../neo/neo.css">
<link rel="stylesheet" href="flat.css">
</head>
<!-- data-page 用 cflow：绕开 neo.js 里针对 v1 diagnose 页的强制隐藏 tab 逻辑，
     本页的 tab 显隐由 flow.js 按「上传体量 + 评估深度」自己决定 -->
<body data-page="cflow" data-nav="diagnose">
<aside class="sbar" id="sbar">
  <div class="sb-top">
    <span class="sb-logo plain">🪄</span>
    <b class="sb-name">剧本创作Agent</b>
    <button class="sb-fold" id="sbFold" type="button" title="收起侧栏">◀</button>
  </div>
  <nav class="sb-nav">
    <a class="sb-item" data-nav="entry" href="index.html"><i>🏠</i><span>首页</span></a>
    <button class="sb-item" type="button" data-soon="项目管理为后续规划，Demo 中未开放"><i>📄</i><span>项目</span></button>
    <button class="sb-item" type="button" data-soon="Skill 广场为后续规划，Demo 中未开放"><i>🧩</i><span>Skill 广场</span><em class="sb-new">NEW</em></button>
  </nav>
  <div class="sb-grp">最近项目</div>
  <div class="sb-recent">
    <a class="sb-rec on" href="diagnose.html?stage=result">《退婚当日，我闪婚了首富》</a>
    <button class="sb-rec" type="button" data-soon="Demo 只打通了剧本评估，这个项目未展开">新项目</button>
    <button class="sb-rec" type="button" data-soon="Demo 只打通了剧本评估，这个项目未展开">《心动信号》台词润色…</button>
    <button class="sb-rec" type="button" data-soon="Demo 只打通了剧本评估，这个项目未展开">《长夜未明》短篇改编…</button>
    <button class="sb-rec" type="button" data-soon="Demo 只打通了剧本评估，这个项目未展开">《致命前妻》北美出海…</button>
  </div>
</aside>

<header id="topbar"></header>

<div class="studio">
  <!-- 左：对话（常驻） -->
  <aside class="pane pane-chat" id="paneChat">
    <div class="pane-head">
      <a class="btn btn-ghost btn-sm" href="index.html" title="返回首页">← 返回</a>
      <h3>剧本诊断优化</h3>
      <span class="tag" id="volTag"></span>
      <span class="spacer"></span>
    </div>
    <div class="pane-body"><div class="chat-scroll" id="chatScroll"></div></div>
    <div class="composer">
      <div id="quoteRef"></div>
      <textarea id="chatInput" rows="2" placeholder="继续提问，例如：伏笔怎么样 / 有没有合规风险 / 第 3 集有什么问题"></textarea>
      <div class="composer-bar">
        <span class="hint-inline" id="chatHint"></span>
        <span class="spacer"></span>
        <button class="btn btn-primary btn-sm" id="sendBtn" type="button">发送</button>
      </div>
    </div>
  </aside>

  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" title="拖拽调整宽度，双击复位"></div>

  <!-- 右：只在「多集 + 快速评估」时出现，直接摊开评估报告；其余路径整块收起 -->
  <main class="pane pane-work">
    <div class="pane-head">
      <div class="wtabs" role="tablist" aria-label="工作台" id="wtabs">
        <button class="wtab" role="tab" aria-selected="true" data-panel="panelReport" id="tabReport" hidden>评估报告</button>
      </div>
      <span class="spacer"></span>
      <span class="hint-inline" id="workMeta"></span>
    </div>
    <div class="pane-body" id="workBody" style="display:flex;flex-direction:column">
      <div class="work-panel active" id="panelReport"></div>
      <!-- 标注不出 tab：仅作为数据挂载点，供结果页共享同一份问题数据 -->
      <div class="work-panel" id="panelAnnot" hidden></div>
    </div>
  </main>
</div>

<script src="../js/mock.js"></script>
<script src="../js/ui.js"></script>
<script src="../neo/neo.js"></script>
<script src="../js/report.js"></script>
<script src="../neo/report-neo.js"></script>
<script src="../js/annot.js"></script>
<script src="flow.js"></script>
<script src="flat.js"></script>
</body>
</html>
